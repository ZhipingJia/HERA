#===============================================================================
#                      Default Configuration for QAT
#===============================================================================
# Please do NOT modify this file directly. If you want to modify configurations,
# please:
# 1. Create a new YAML file and copy some bellowing options to it.
# 2. Modify these options in your YAML file.
# 3. run main_QAT_classifier.py with your configuration file in the command line, like this:
#       $ python main_QAT_classifier.py path/to/your/config/file
# The options modified in your configuration file will overwrite those in this
# file.
#============================ mode settings ====================================

# Experiment name
name: MyProject
# Name of output directory. Checkpoints and logs will be saved at `pwd`/output_dir
output_dir: out
# whether save onnx for quant model, only symmetric quantization is supported
onnx: false
# Evaluate the model without training
eval: false
# whether quantize images. if true, set quan for detailed
img_quant_flag: false
# final eval times, get mean acc and std to logger
final_eval_times: 1
# seed
seed: 0
#============================ Environment ======================================

# Device to be used
device:
  # Use CPU or GPU (choices: cpu, cuda)
  type: cuda
  # GPU device IDs to be used. Only valid when device.type is 'cuda'
  gpu: [0, 1]

# Dataset loader
dataloader:
  # Dataset to train/validate (choices: imagenet, cifar10)
  dataset: imagenet
  # Number of categories in the specified dataset (choices: 1000, 10)
  num_classes: 1000
  # Path to dataset directory
  path: /localhome/fair/Dataset/imagenet
  # Size of mini-batch
  batch_size: 64
  # Number of data loading workers
  workers: 32
  # Seeds random generators in a deterministic way (i.e., set all the seeds 0).
  # Please keep it true when resuming the experiment from a checkpoint
  deterministic: true
  # Load the model without DataParallel wrapping it
  serialized: false
  # Portion of training dataset to set aside for validation (range: [0, 1))
  val_split: 0.

resume:
  # Path to a checkpoint to be loaded. Leave blank to skip
  path:
  # Resume model parameters only
  lean: false

log:
  # Number of best scores to track and report
  num_best_scores: 3
  # Print frequency
  print_freq: 20

#============================ Model ============================================

# Supported model architecture
# choices:
#   ImageNet:
#     resnet18, resnet34, resnet50, resnet101, resnet152
#   CIFAR10:
#     resnet20, resnet32, resnet44, resnet56, resnet110, resnet1202
#   etc:...
model:
  # model name
  arch: resnet18
  # Use pre-trained model
  pre_trained: false
  # load float32 model befor training
  checkpoint:
  # load quant model, 'quant_checkpoint' and 'checkpoint' can not be valued together
  quant_checkpoint:
  # load strict arg
  strict: true
  # loss function
  criterion:

#============================ Quantization =====================================
structure:
  bn_fused: false
  bias_move: false
  func_quant: false
  add_quant:
    quant_method: 0
    shift: 0
  insert_quantizer:
quan:
  img_quant_flag: false
  img_quant_bit: 4
  init_batch: false
  init_batch_num: 0
  conv:
    int_flag: false
    act: # (default for all conv layers)
      # Quantizer type (choices: lsq, uniform, binary)
      quant_name:
    weight: # (default for all layers)
      # Quantizer type (choices: lsq, uniform, binary)
      quant_name:
      # weight noise
      noise_scale: 0
    act_out:
      quant_name:
  fc:
    int_flag: false
    act: # (default for all fc layers)
      # Quantizer type (choices: lsq, uniform, binary)
      quant_name:
    weight: # (default for all layers)
      # Quantizer type (choices: lsq, uniform, binary)
      quant_name:
    act_out:
      quant_name:
  # excepts:
    # Specify quantized bit width for some layers, like this:
    # conv1:
    #   act:
    #     all_positive: false
    #   weight:
    #     bit:
    # fc:
    #   act:
    #     bit:
    #   weight:
    #     bit:

#============================ Training settings ============================

epochs: 90

optimizer:
  op_name: SGD
#  learning_rate: 0.01
#  momentum: 0.9
#  weight_decay: 0.0001

# Learning rate scheduler
lr_scheduler:
  # Update learning rate per batch or epoch
  update_per_batch: false

  # Uncomment one of bellowing options to activate a learning rate scheduling

  # Fixed learning rate
  mode: fixed

  # Step decay
  # mode: step
  # step_size: 30
  # gamma: 0.1

  # Multi-step decay
  # mode: multi_step
  # milestones: [30, ]
  # gamma: 0.1

  # Exponential decay
  # mode: exp
  # gamma: 0.95

  # Cosine annealing
  # mode: cos
  # lr_min: 0
  # cycle: 0.95

  # Cosine annealing with warm restarts
  # mode: cos_warm_restarts
  # lr_min: 0
  # cycle: 5
  # cycle_scale: 2
  # amp_scale: 0.5
